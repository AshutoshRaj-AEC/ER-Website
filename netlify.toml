[build]
  command = "npm run build"
  publish = "dist"

# Public client-side values (safe to commit). VITE_GOOGLE_CLIENT_ID is set in
# the Netlify dashboard.
[build.environment]
  VITE_SUPABASE_URL = "https://ztzuefhbdqanfutcpjzz.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i7b3Hfm4i7nK3TWy8pvAhQ_x_xQb7EX"

# Security headers for every page.
# - CSP allows only this site plus the services it uses: Google sign-in,
#   Google Fonts, the Unsplash hero image, Google profile photos and Supabase.
#   'unsafe-inline' for styles is needed by React style attributes and Google
#   sign-in; scripts stay locked to this site and Google sign-in.
# - The microphone is allowed for Song Vault voice notes on this site only.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.googleusercontent.com https://ztzuefhbdqanfutcpjzz.supabase.co; media-src 'self' blob: https://ztzuefhbdqanfutcpjzz.supabase.co; connect-src 'self' https://ztzuefhbdqanfutcpjzz.supabase.co wss://ztzuefhbdqanfutcpjzz.supabase.co https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Serve the app for /submit, /admin and any other client-side route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
